[project]
name = "tarski"
version = "0.2.0"
description = "Local decision models: train small task branches on a frozen encoder with your own labels, and serve many decisions per message from one pass."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# public benchmarks (`tarski train banking77`, clinc150, typed-decisions)
benchmarks = ["datasets>=5.0.1"]
# everything the experiments/ and explore/ scripts import
research = ["datasets>=5.0.1", "laya>=0.3.20", "tabicl>=2.2.0", "coremltools>=9.0"]
# diffusion-LM reads on Apple silicon (dlm/): DiffusionGemma through mlx-vlm
dlm = ["mlx>=0.30", "mlx-vlm>=0.7.3"]

[project.scripts]
tarski = "tarski.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tarski"]

[tool.pytest.ini_options]
testpaths = ["tests"]
