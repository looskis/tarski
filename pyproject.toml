[project]
name = "tarski"
version = "0.3.0"
description = "Data-driven read policies for diffusion decision models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
benchmarks = ["datasets>=5.0.1"]
dlm = ["mlx>=0.30; sys_platform == 'darwin' and platform_machine == 'arm64'", "mlx-vlm>=0.7.3; sys_platform == 'darwin' and platform_machine == 'arm64'", "httpx>=0.28.1", "transformers>=5.17.0"]
torch = ["torch>=2.14.0", "transformers>=5.17.0", "httpx>=0.28.1"]

[project.scripts]
tarski = "tarski.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tarski", "dlm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
